name: SmartAccess CI

on:
  push:
    branches:
      - feat/phase-4-CI-foundation
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-midpoint-db
          MIDPOINT_ADMIN_PASSWORD: ci-only-midpoint-admin
          KEYCLOAK_DB_PASSWORD: ci-only-keycloak-db
          KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin
        run: docker compose --env-file /dev/null -f app/compose.yaml config --quiet

  build:
    name: Build Keycloak image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build the multi-stage image
        run: docker build --tag smartaccess-keycloak:local app/keycloak

      - name: Show image platform
        run: docker image inspect --format '{{.Os}}/{{.Architecture}}' smartaccess-keycloak:local

      - name: Save Keycloak image
        run: docker image save --output keycloak-image.tar smartaccess-keycloak:local

      - name: Upload Keycloak image artifact
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-image
          path: keycloak-image.tar
          if-no-files-found: error
          retention-days: 7

  test:
    name: Smoke test Keycloak and midPoint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-midpoint-db
      MIDPOINT_ADMIN_PASSWORD: ci-only-midpoint-admin
      KEYCLOAK_DB_PASSWORD: ci-only-keycloak-db
      KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Keycloak image artifact
        uses: actions/download-artifact@v8
        with:
          name: keycloak-image

      - name: Load the built image
        run: docker image load --input keycloak-image.tar

      - name: Start the Compose stack
        run: |
          docker compose --env-file /dev/null -f app/compose.yaml \
            up --no-build --wait --wait-timeout 300 midpoint keycloak

      - name: Check Keycloak health and metrics and midPoint HTTP access
        shell: bash
        run: |
          check_http_200() {
            local url="$1"
            local output="$2"
            shift 2
            local status

            status=$(curl --fail --silent --show-error \
              --max-time 5 --retry 30 --retry-delay 4 \
              --retry-max-time 150 --retry-all-errors \
              --output "$output" --write-out '%{http_code}' "$@" "$url")

            echo "$url returned HTTP $status"
            test "$status" = 200
          }

          check_http_200 http://127.0.0.1:9000/health/live "$RUNNER_TEMP/keycloak-live.json"
          jq -e '.status == "UP"' "$RUNNER_TEMP/keycloak-live.json" >/dev/null

          check_http_200 http://127.0.0.1:9000/health/ready "$RUNNER_TEMP/keycloak-ready.json"
          jq -e '.status == "UP"' "$RUNNER_TEMP/keycloak-ready.json" >/dev/null

          check_http_200 http://127.0.0.1:9000/metrics "$RUNNER_TEMP/keycloak-metrics.txt"
          grep -q '^# TYPE ' "$RUNNER_TEMP/keycloak-metrics.txt"

          check_http_200 http://127.0.0.1:8080/midpoint/actuator/health /dev/null

      - name: Show container status on failure
        if: failure()
        run: docker compose --env-file /dev/null -f app/compose.yaml ps -a
  security:
    name: Scan Keycloak image with Trivy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Keycloak image artifact
        uses: actions/download-artifact@v8
        with:
          name: keycloak-image

      - name: Scan for high and critical vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD/keycloak-image.tar,target=/scan/keycloak-image.tar,readonly" \
            ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --input /scan/keycloak-image.tar \
            --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --timeout 10m 2>&1 | tee trivy-report.txt

      - name: Upload Trivy report
        if: ${{ always() && hashFiles('trivy-report.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish the verified Keycloak image to GHCR
    needs: [test, security]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Download Keycloak image artifact
        uses: actions/download-artifact@v8
        with:
          name: keycloak-image

      - name: Load the verified image
        run: docker image load --input keycloak-image.tar

      - name: Publish the image with its commit SHA
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-keycloak:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker image tag smartaccess-keycloak:local "$image"
          docker image push "$image"