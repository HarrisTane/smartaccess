services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: midpoint
      POSTGRES_USER: midpoint
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Passwort fehlt}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "midpoint", "-d", "midpoint"]
      interval: 5s
      timeout: 3s
      retries: 12

  db-check:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Passwort fehlt}"
    command:
      - sh
      - -ec
      - |
        rm -f /state/db_state
        count=$$(psql -X -w -v ON_ERROR_STOP=1 \
          -h postgres -U midpoint -d midpoint -tA \
          -c "SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog', 'information_schema')")
        if [ "$$count" = "0" ]; then
          echo empty > /state/db_state
        else
          echo filled > /state/db_state
        fi
        echo "Zustand der Datenbank: $$(cat /state/db_state)"
    volumes:
      - init_state:/state

  midpoint-init:
    image: evolveum/midpoint:4.11.0
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      db-check:
        condition: service_completed_successfully
    working_dir: /opt/midpoint
    command:
      - bash
      - -ec
      - |
        state=$$(cat /state/db_state)

        echo "Initialisiere midPoint-Home und Konfiguration..."
        bin/midpoint.sh init-native

        case "$$state" in
          empty)
            echo "Datenbank ist leer, lege Repository- und Audit-Schema an..."
            bin/ninja.sh run-sql --create --mode REPOSITORY
            bin/ninja.sh run-sql --create --mode AUDIT
            ;;
          filled)
            echo "Tabellen vorhanden, ueberspringe Schema-Erstellung."
            ;;
          *)
            echo "Unbekannter Datenbankzustand: $$state" >&2
            exit 1
            ;;
        esac

        echo "Pruefe Datenbank und Repository..."
        bin/ninja.sh -B info
        echo "Repository-Pruefung erfolgreich."
    environment:
      MP_INIT_CFG: /opt/midpoint/var
      MP_SET_midpoint_repository_database: postgresql
      MP_SET_midpoint_repository_jdbcUrl: "jdbc:postgresql://postgres:5432/midpoint"
      MP_SET_midpoint_repository_jdbcUsername: midpoint
      MP_SET_midpoint_repository_jdbcPassword: "${POSTGRES_PASSWORD:?Passwort fehlt}"
      MP_UNSET_midpoint_repository_hibernateHbm2ddl: "1"
      MP_NO_ENV_COMPAT: "1"
    volumes:
      - midpoint_home:/opt/midpoint/var
      - init_state:/state:ro

  midpoint:
    image: evolveum/midpoint:4.11.0
    restart: unless-stopped
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    depends_on:
      postgres:
        condition: service_healthy
      midpoint-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx2g"
      MP_SET_midpoint_repository_database: postgresql
      MP_SET_midpoint_repository_jdbcUrl: "jdbc:postgresql://postgres:5432/midpoint"
      MP_SET_midpoint_repository_jdbcUsername: midpoint
      MP_SET_midpoint_repository_jdbcPassword: "${POSTGRES_PASSWORD:?Passwort fehlt}"
      MP_SET_midpoint_administrator_initialPassword: "${MIDPOINT_ADMIN_PASSWORD:?Admin-Passwort fehlt}"
      MP_UNSET_midpoint_repository_hibernateHbm2ddl: "1"
      MP_NO_ENV_COMPAT: "1"
    volumes:
      - midpoint_home:/opt/midpoint/var

volumes:
  postgres_data:
  midpoint_home:
  init_state:
